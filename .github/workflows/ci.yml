name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  # Images built in the integration job are tagged exactly as docker-compose.yml expects, so the
  # stack can start with --no-build instead of compiling a second time.
  BACKEND_IMAGE: nexa-ai-backend:local
  FRONTEND_IMAGE: nexa-ai-frontend:local

jobs:
  backend:
    name: Backend — lint, migrations, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa_ci_password
          POSTGRES_DB: nexa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexa -d nexa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://nexa:nexa_ci_password@localhost:5432/nexa_test
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .

      - name: Apply migrations to PostgreSQL
        run: alembic upgrade head

      # The local-development path: the migrations must apply to SQLite too, and the API must be
      # able to write to a schema they created. Its own step so a regression is attributed to the
      # SQLite path instead of hiding inside the full suite, which also collects these tests.
      - name: Migrations and auth flow on SQLite
        run: pytest tests/test_sqlite_migrations.py

      - name: Import the application
        run: python -c "from app.main import app; print(app.title)"

      - name: Tests
        run: pytest --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml
          if-no-files-found: warn

      - name: Summarize test results
        if: always()
        working-directory: ${{ github.workspace }}
        run: python scripts/junit-summary.py --title "Backend tests" backend/test-results.xml >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend — lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Turbopack's incremental build cache; a cold Next build is ~40 MB of compile artifacts.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**/*', 'frontend/next.config.ts', 'frontend/tsconfig.json') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # `default` keeps the readable console log; `junit` feeds the artifact and the run summary.
      # `--coverage` also applies the thresholds in vitest.config.mts, so a drop below them fails
      # this step rather than only showing up in the report.
      - name: Tests and coverage
        run: npm test -- --coverage --reporter=default --reporter=junit --outputFile=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results.xml
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn

      # setup-python is not otherwise needed here; it guarantees the `python` the summary script uses.
      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Summarize test results
        if: always()
        working-directory: ${{ github.workspace }}
        run: python scripts/junit-summary.py --title "Frontend tests" frontend/test-results.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize coverage
        if: always()
        working-directory: ${{ github.workspace }}
        run: python scripts/coverage-summary.py --title "Frontend coverage" --threshold 95 frontend/coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Production build
        run: npm run build

  ml:
    name: ML workspace — lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ml/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-test-results
          path: ml/test-results.xml
          if-no-files-found: warn

      - name: Summarize test results
        if: always()
        working-directory: ${{ github.workspace }}
        run: python scripts/junit-summary.py --title "ML workspace tests" ml/test-results.xml >> "$GITHUB_STEP_SUMMARY"

  # The local-development stack from docs/development.md: SQLite instead of the compose database,
  # both services started as processes. It runs the same cross-service suite as the container job,
  # then reuses those services for Playwright, so the BFF, proxy and rendered-UI paths are exercised
  # without Docker. It runs in parallel rather than extending the backend job, which has no Node
  # toolchain and should stay fast.
  sqlite:
    name: SQLite stack — integration and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:////tmp/nexa-ci.db
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            tests/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      # Same migrations as the PostgreSQL job: the schema must be creatable by Alembic alone.
      - name: Migrate the SQLite database
        working-directory: backend
        run: alembic upgrade head

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Start the stack
        run: |
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/backend.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/backend.pid"
          cd ../frontend
          # The BFF, the proxy and /api/health reach the API through the server-side URL.
          API_INTERNAL_URL=http://127.0.0.1:8000/api/v1 \
            nohup npx next start -H 127.0.0.1 -p 3000 \
            > "$RUNNER_TEMP/frontend.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/frontend.pid"

      - name: Wait for backend readiness
        run: ./scripts/wait-for-http.sh http://127.0.0.1:8000/api/v1/health 120

      - name: Wait for frontend readiness
        run: ./scripts/wait-for-http.sh http://127.0.0.1:3000/api/health 120

      - name: Install integration test dependencies
        run: pip install -r tests/requirements.txt

      # No NEXA_REQUIRE_COMPOSE_DB here: the database outage test needs the compose service, so it
      # skips and the container job keeps proving that path.
      - name: Integration tests
        env:
          NEXA_BACKEND_URL: http://127.0.0.1:8000
          NEXA_FRONTEND_URL: http://127.0.0.1:3000
        run: pytest tests -q --junitxml=integration-report.xml

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-integration-test-results
          path: integration-report.xml
          if-no-files-found: warn

      - name: Summarize integration test results
        if: always()
        run: python scripts/junit-summary.py --title "SQLite stack integration tests" integration-report.xml >> "$GITHUB_STEP_SUMMARY"

      # Reuse the running services for browser flows. The browser is only downloaded once per
      # lockfile because @playwright/test is a dev dependency of the frontend workspace.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser E2E tests
        working-directory: frontend
        env:
          # Canonical origin: the BFF compares Origin with Next's request origin, which is
          # localhost even when the server listens on 127.0.0.1.
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:8000/api/v1
        run: npm run test:e2e

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/e2e-results.xml
          if-no-files-found: warn

      - name: Summarize browser test results
        if: always()
        run: python scripts/junit-summary.py --title "Browser E2E tests" frontend/e2e-results.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Service logs
        if: failure()
        run: |
          echo "::group::backend"; tail -n 200 "$RUNNER_TEMP/backend.log" || true; echo "::endgroup::"
          echo "::group::frontend"; tail -n 200 "$RUNNER_TEMP/frontend.log" || true; echo "::endgroup::"

      - name: Stop the stack
        if: always()
        run: |
          for file in "$RUNNER_TEMP/backend.pid" "$RUNNER_TEMP/frontend.pid"; do
            if [[ -f "$file" ]]; then kill "$(cat "$file")" 2>/dev/null || true; fi
          done

  integration:
    name: Containers — compose stack + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, ml]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/requirements.txt

      # The default `docker` builder cannot import/export the GitHub Actions cache, so use a
      # buildx builder for both image builds.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose configuration
        run: docker compose config --quiet

      - name: Build backend image (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: ${{ env.BACKEND_IMAGE }}
          provenance: false
          # Layer cache is keyed on the Dockerfile + pyproject.toml + source; source changes still
          # reuse the dependency layer thanks to the split in backend/Dockerfile.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}
          provenance: false
          build-args: |
            NEXT_PUBLIC_APP_NAME=Nexa AI
            NEXT_PUBLIC_APP_VERSION=0.1.0
            NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
            NEXT_PUBLIC_SITE_URL=http://localhost:3000
          # Separate scope: the Next.js build cache and npm layers are unrelated to the backend's.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Start stack
        # Nothing is rebuilt here: both images are already loaded from the cached builds above.
        run: docker compose up -d --no-build

      - name: Wait for backend readiness
        run: ./scripts/wait-for-http.sh http://localhost:8000/api/v1/health 180

      - name: Wait for frontend readiness
        run: ./scripts/wait-for-http.sh http://localhost:3000/api/health 180

      - name: Install integration test dependencies
        run: pip install -r tests/requirements.txt

      - name: Integration tests
        env:
          # This job owns the compose stack, so the database outage test must run rather than skip.
          NEXA_REQUIRE_COMPOSE_DB: "1"
        run: pytest tests -q --junitxml=integration-report.xml

      # Per-test outcomes for reviewers who cannot read job logs (they need admin rights).
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: integration-report.xml
          if-no-files-found: warn

      - name: Summarize integration test results
        if: always()
        run: python scripts/junit-summary.py --title "Integration tests" integration-report.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
