name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  # Images built in the integration job are tagged exactly as docker-compose.yml expects, so the
  # stack can start with --no-build instead of compiling a second time.
  BACKEND_IMAGE: nexa-ai-backend:local
  FRONTEND_IMAGE: nexa-ai-frontend:local

jobs:
  backend:
    name: Backend — lint, migrations, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa_ci_password
          POSTGRES_DB: nexa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexa -d nexa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://nexa:nexa_ci_password@localhost:5432/nexa_test
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .

      - name: Apply migrations to PostgreSQL
        run: alembic upgrade head

      - name: Import the application
        run: python -c "from app.main import app; print(app.title)"

      - name: Tests
        run: pytest

  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Turbopack's incremental build cache; a cold Next build is ~40 MB of compile artifacts.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**/*', 'frontend/next.config.ts', 'frontend/tsconfig.json') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  ml:
    name: ML workspace — lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ml/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest

  integration:
    name: Containers — compose stack + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, ml]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/requirements.txt

      # The default `docker` builder cannot import/export the GitHub Actions cache, so use a
      # buildx builder for both image builds.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose configuration
        run: docker compose config --quiet

      - name: Build backend image (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: ${{ env.BACKEND_IMAGE }}
          provenance: false
          # Layer cache is keyed on the Dockerfile + pyproject.toml + source; source changes still
          # reuse the dependency layer thanks to the split in backend/Dockerfile.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}
          provenance: false
          build-args: |
            NEXT_PUBLIC_APP_NAME=Nexa AI
            NEXT_PUBLIC_APP_VERSION=0.1.0
            NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
            NEXT_PUBLIC_SITE_URL=http://localhost:3000
          # Separate scope: the Next.js build cache and npm layers are unrelated to the backend's.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Start stack
        # Nothing is rebuilt here: both images are already loaded from the cached builds above.
        run: docker compose up -d --no-build

      - name: Wait for backend readiness
        run: ./scripts/wait-for-http.sh http://localhost:8000/api/v1/health 180

      - name: Wait for frontend readiness
        run: ./scripts/wait-for-http.sh http://localhost:3000/api/health 180

      - name: Install integration test dependencies
        run: pip install -r tests/requirements.txt

      - name: Integration tests
        env:
          # This job owns the compose stack, so the database outage test must run rather than skip.
          NEXA_REQUIRE_COMPOSE_DB: "1"
        run: pytest tests -q

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
